<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Safety Shooter · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0c0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            padding: 12px;
            margin: 0;
            touch-action: none;
        }
        /* ---------- CRT MONITOR FRAME ---------- */
        .crt-wrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            aspect-ratio: 4 / 3;
            background: #1a1a1a;
            border-radius: 36px 36px 28px 28px;
            padding: 18px 18px 38px 18px;
            box-shadow: 0 0 0 2px #2a2a2a, 0 0 0 6px #111, 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 20, 0, 0.6);
        }
        .crt-wrapper::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: #222;
            border-radius: 40px;
            box-shadow: inset 0 2px 4px #000, 0 0 4px #0f0f0f;
        }
        .crt-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0d130d;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 30, 0, 0.5), 0 0 0 1px #2f3f2f;
        }
        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
            border-radius: 20px;
            mix-blend-mode: multiply;
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        }
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(20, 60, 30, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 60, 30, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            border-radius: 20px;
            z-index: 0;
        }

        /* ---------- OVERLAY & UI ---------- */
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(12px);
            z-index: 30;
            border-radius: 20px;
            padding: 20px;
            transition: 0.2s;
            overflow-y: auto;
            text-align: center;
            color: #f0f0f0;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay h2 {
            color: #7cfc9e;
            text-shadow: 0 0 10px #1faa3a;
            margin-bottom: 12px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            letter-spacing: 2px;
        }
        .btn {
            background: #2c2f3a;
            border: none;
            color: white;
            font-weight: bold;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            padding: 8px 20px;
            margin: 6px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #0f0f17;
            font-family: monospace;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #4a5a72;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #0f0f17;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f0f17;
        }
        .btn-green {
            background: radial-gradient(circle at 30% 30%, #3cdb6a, #1a8a3a);
            color: #0a1a0a;
            box-shadow: 0 0 0 3px #3a7a4a, 0 0 30px rgba(60, 255, 120, 0.3);
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            padding: 12px 32px;
            animation: pulse-glow 2.2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% { box-shadow: 0 0 0 3px #3a7a4a, 0 0 30px rgba(60, 255, 120, 0.3); }
            50% { box-shadow: 0 0 0 4px #5a9a6a, 0 0 50px rgba(60, 255, 120, 0.5); }
        }
        .btn-red {
            background: #b53b3b;
            box-shadow: 0 4px 0 #631e1e;
        }
        .btn-sm {
            font-size: 0.7rem;
            padding: 4px 14px;
        }
        .mode-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .mode-btn {
            background: #1a2a1a;
            border: 2px solid #3a6a4a;
            border-radius: 20px;
            padding: 14px 22px;
            min-width: 120px;
            cursor: pointer;
            transition: 0.12s;
            color: #7cfc9e;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 40, 0, 0.2);
            text-decoration: none;
            display: inline-block;
            background: #0f1a0f;
        }
        .mode-btn:hover {
            transform: scale(1.04);
            border-color: #7cfc9e;
            background: #1f3a2a;
        }
        .mode-btn .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }
        .subnote {
            font-size: 0.55rem;
            opacity: 0.7;
            margin-top: 12px;
        }
        .class-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .class-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            margin: 4px;
            text-align: center;
            min-width: 100px;
        }
        .class-stats {
            font-size: 0.5rem;
            color: #aaa;
        }
        .instruction-manual {
            background: #0f172ad9;
            backdrop-filter: blur(12px);
            border: 2px solid #ffcc77;
            border-radius: 24px;
            padding: 16px;
            max-width: 480px;
            text-align: left;
            color: #f0f0f0;
            font-family: monospace;
            font-size: 0.7rem;
            line-height: 1.8;
            margin: 10px 0;
        }
        .instruction-manual ul {
            padding-left: 20px;
            list-style: none;
        }
        .instruction-manual li::before {
            content: "▸ ";
            color: #ffcc77;
        }
        .warning-text {
            color: #ffaa66;
            font-weight: bold;
        }
        /* ---------- SKINS ---------- */
        .skin-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .skin-dot {
            width: clamp(40px, 6vw, 56px);
            height: clamp(40px, 6vw, 56px);
            border-radius: 50%;
            border: 3px solid #2a4a3a;
            cursor: pointer;
            transition: 0.12s;
            box-shadow: 0 0 0 1px #1a2a1a, inset 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .skin-dot:hover {
            transform: scale(1.1);
            border-color: #7cfc9e;
        }
        .skin-dot.active {
            border-color: #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* ---------- CANVAS ---------- */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e2a1a;
            touch-action: none;
            cursor: crosshair;
        }

        /* ---------- UI OVERLAY (in-game HUD) ---------- */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            border-left: 3px solid #ff7e5e;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.5px;
            pointer-events: none;
            font-family: monospace;
            min-width: 140px;
            color: #eee;
        }
        #hud .bar {
            width: 100px;
            height: 5px;
            background: #2b2b2b;
            border-radius: 10px;
            overflow: hidden;
            margin: 2px 0 4px 0;
        }
        #hud .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.1s ease;
        }
        #hpBar { background: #e34d4d; }
        #xpBar { background: #3cc7f2; box-shadow: 0 0 4px #00ccff; }
        #healBar { background: #2ecc71; box-shadow: 0 0 3px #2ecc71; width: 0%; }
        .hud-row {
            display: flex;
            gap: 8px;
            font-size: 9px;
            flex-wrap: wrap;
        }
        #powerupDisplay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid gold;
            color: #fff;
            pointer-events: none;
        }
        #restartBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 25;
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ffaa66;
            font-family: monospace;
            font-size: 11px;
            color: #ffcc99;
            transition: 0.1s;
        }
        #restartBtn:active {
            background: #b53b3b;
            transform: scale(0.95);
        }

        /* ---------- TOUCH CONTROLS ---------- */
        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            pointer-events: none;
            z-index: 15;
            touch-action: none;
            display: none;
            /* hidden by default, shown in mobile mode */;
        }
        .touch-controls.active {
            display: block;
        }
        .joystick-area {
            position: absolute;
            left: 10px;
            bottom: 10px;
            width: 100px;
            height: 100px;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joystick-knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transform: translate(0, 0);
            transition: none;
            will-change: transform;
        }
        .shoot-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 70px;
            height: 70px;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
            background: rgba(255, 60, 60, 0.4);
            border: 3px solid #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black;
            backdrop-filter: blur(4px);
        }
        .shoot-btn:active {
            background: rgba(255, 60, 60, 0.8);
            transform: scale(0.92);
        }
        .powerup-touch {
            position: absolute;
            right: 10px;
            bottom: 90px;
            width: 44px;
            height: 44px;
            pointer-events: auto;
            touch-action: manipulation;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.4);
            border: 2px solid gold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            text-shadow: 0 0 10px black;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }
        .powerup-touch:active {
            background: rgba(255, 215, 0, 0.8);
            transform: scale(0.9);
        }
        @media (max-width: 500px) {
            .joystick-area { width: 80px; height: 80px; left: 6px; bottom: 6px; }
            .joystick-knob { width: 32px; height: 32px; }
            .shoot-btn { width: 56px; height: 56px; right: 6px; bottom: 6px; font-size: 12px; }
            .powerup-touch { width: 36px; height: 36px; right: 6px; bottom: 72px; font-size: 14px; }
            #hud { font-size: 8px; padding: 4px 8px; min-width: 100px; top: 5px; left: 5px; }
            #hud .bar { width: 70px; height: 4px; }
            .hud-row { font-size: 7px; }
            #powerupDisplay { font-size: 9px; padding: 3px 10px; bottom: 10px; right: 10px; }
            #restartBtn { font-size: 9px; padding: 3px 8px; top: 5px; right: 5px; }
        }
        /* ---------- QUIZ STYLES ---------- */
        .quiz-container {
            max-width: 400px;
            width: 100%;
            background: #FFFBF0;
            border-radius: 32px;
            padding: 16px;
            text-align: center;
            color: #1E3B4F;
            font-family: 'Segoe UI', system-ui;
            box-shadow: 0 20px 35px black;
        }
        .quiz-question {
            background: #E9F3F8;
            border-radius: 30px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: bold;
        }
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
        }
        .quiz-btn {
            background: #F4C542;
            color: #2C3E50;
            font-size: 0.8rem;
            padding: 6px 12px;
            min-width: 100px;
            box-shadow: 0 3px 0 #B7621A;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .quiz-btn.correct-feedback {
            background: #2E8B57;
            color: white;
        }
        .quiz-btn.wrong-feedback {
            background: #CD5C5C;
            color: white;
        }
        .quiz-feedback {
            background: #FFF2E0;
            border-radius: 24px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="crt-wrapper">
    <div class="crt-screen">
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="grid-bg"></div>

        <!-- CANVAS -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD (in-game) -->
        <div id="hud" class="hidden">
            HP <div class="bar"><div id="hpBar" class="fill" style="width:100%"></div></div>
            XP <div class="bar"><div id="xpBar" class="fill" style="width:0%"></div></div>
            REGEN <div class="bar"><div id="healBar" class="fill" style="width:0%"></div></div>
            <div class="hud-row">
                <span>SCORE: <strong id="scoreVal">0</strong></span>&nbsp;|&nbsp;
                <span>LVL <strong id="lvlVal">1</strong></span>&nbsp;|&nbsp;
                <span id="classLabel">ASSAULT</span>
            </div>
            <div id="evoHint" style="font-size:8px; margin-top:2px; color:#d4af37;"></div>
        </div>
        <div id="powerupDisplay" class="hidden">NO POWERUP</div>
        <div id="restartBtn" class="hidden">RESTART</div>

        <!-- TOUCH CONTROLS -->
        <div class="touch-controls" id="touchControls">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="shoot-btn" id="shootBtn">SHOOT</div>
            <div class="powerup-touch" id="powerupBtn">⚡</div>
        </div>

        <!-- OVERLAY (menus, quiz, etc.) -->
        <div id="overlay"></div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM REFS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const hud = document.getElementById('hud');
        const powerupDisplay = document.getElementById('powerupDisplay');
        const restartBtn = document.getElementById('restartBtn');
        const touchControls = document.getElementById('touchControls');

        // ---------- CANVAS SIZING ----------
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ---------- SKIN SYSTEM ----------
        const SKIN_KEY = 'safety_shooter_skin';
        let currentSkin = localStorage.getItem(SKIN_KEY) || 'blue';
        const skinColors = {
            blue: { main: "#42f5aa", dark: "#269e6b", light: "#88ffcc" },
            red: { main: "#ff5555", dark: "#cc3333", light: "#ff8888" },
            green: { main: "#55ff55", dark: "#33aa33", light: "#88ff88" },
            yellow: { main: "#ffdd44", dark: "#ccaa22", light: "#ffee88" }
        };

        function setSkin(color) {
            currentSkin = color;
            localStorage.setItem(SKIN_KEY, color);
            updateUI();
        }

        // ---------- SAFETY QUIZ DATA ----------
        const safetyQuestions = [
            { text: "A game asks for your real name and address to send you a prize. What do you do?", options: ["Give the info to get the prize", "Ask a parent first", "Type a fake name", "Ignore it but keep playing"], correctIndex: 1, explanation: "Always ask a parent before sharing real name or address online.", correctMsg: "Great job! Asking a parent keeps you safe." },
            { text: "Someone you don't know sends you a friend request. What is safest?", options: ["Accept, more friends = more fun", "Accept but block them later", "Decline and tell a parent", "Ask them questions first"], correctIndex: 2, explanation: "Only accept friend requests from people you know in real life.", correctMsg: "Perfect! Only add real friends. Tell a parent about strangers." },
            { text: "Your online friend asks for your password to 'help' you. What do you say?", options: ["Sure, here is my password", "No, passwords are secret", "Only give half the password", "Ask what they need it for"], correctIndex: 1, explanation: "Never share your password with anyone except your parents.", correctMsg: "Excellent! Keep passwords secret." },
            { text: "You see something online that makes you feel scared or sad. What should you do?", options: ["Keep watching alone", "Tell a parent or teacher", "Send it to a friend", "Close it and forget"], correctIndex: 1, explanation: "Always tell a trusted adult when something online bothers you.", correctMsg: "So smart! Telling an adult is always the right choice." },
            { text: "A stranger messages you saying, 'You are so cool! Send me a picture of yourself.' What is safest?", options: ["Send a picture to be nice", "Say no and block them", "Send a picture of my pet", "Ask why they want it"], correctIndex: 1, explanation: "Never send photos to strangers. Block them and tell a parent.", correctMsg: "Perfect! Block strangers who ask for photos." },
            { text: "You play games for 3 hours and feel tired. What is the best choice?", options: ["Keep playing all night", "Take a break and rest", "Play one more hour", "Get snacks and keep going"], correctIndex: 1, explanation: "Taking breaks is healthy for your eyes, body, and brain.", correctMsg: "Great job! Taking breaks keeps you healthy." },
            { text: "Someone online says mean things to you. What should you do?", options: ["Say mean things back", "Cry and say nothing", "Tell a parent and block them", "Ignore and keep talking"], correctIndex: 2, explanation: "Tell a parent right away when someone is mean. Block them.", correctMsg: "You did the bravest thing! Telling a parent stops the meanness." },
            { text: "A website asks for your phone number to 'verify your age.' What is safest?", options: ["Type my real number", "Type a fake number", "Ask a parent first", "Close the website"], correctIndex: 2, explanation: "Never give your phone number online without a parent.", correctMsg: "Smart choice! Parents help decide what is safe to share." },
            { text: "You want to make a strong password. Which one is safest?", options: ["123456", "password", "MyName2024", "Tiger9Lemon7"], correctIndex: 3, explanation: "A strong password has letters, numbers, and symbols.", correctMsg: "Excellent! That is a super strong password." },
            { text: "A friend shares a secret about another kid online. What should you do?", options: ["Share it with more people", "Keep the secret forever", "Tell a trusted adult", "Ask the friend to stop"], correctIndex: 2, explanation: "If a secret could hurt someone, tell an adult.", correctMsg: "You are a good friend! Telling an adult helps everyone stay safe." }
        ];
        let currentQuizIndex = 0;

        // ---------- GAME STATE ----------
        let player = null;
        let bullets = [];
        let enemies = [];
        let boss = null;
        let bossProjectiles = [];
        let keys = {};
        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        let running = false;
        let gamePaused = false;
        let score = 0;
        let xp = 0;
        let level = 1;

        let healingUpgradeLevel = 0;
        let baseHealingPerSecond = 0;
        const MAX_HEALING_UPGRADE = 5;

        let upgrades = { damage: 1, fireRate: 1, speed: 1, bulletSpeed: 1 };
        let upgradeLevels = { damage: 0, fireRate: 0, speed: 0, bulletSpeed: 0 };
        const MAX_UPGRADE_LEVEL = 10;

        let lastShot = 0;
        let shootHeld = false;
        let currentClass = "Assault";
        let evolvedForm = null;

        let lastBossDeathTime = 0;
        let invincibleFrames = 0;
        let invincibleDuration = 60;

        let currentPowerup = null;
        let nextPowerupSpawn = 0;
        let powerupObject = null;

        let bossBaseHp = 480;
        let bossDamage = 20;
        let lastHealTimestamp = 0;

        // Touch joystick state
        let joystickActive = false;
        let joystickDX = 0,
            joystickDY = 0;
        let controlMode = null; // 'web' or 'mobile'

        // ---------- UI HELPERS ----------
        function updateUI() {
            if (!player) return;
            let hpPercent = (player.hp / player.maxHp) * 100;
            let xpPercent = (xp / 50) * 100;
            let healPercent = (healingUpgradeLevel / MAX_HEALING_UPGRADE) * 100;
            document.getElementById('hpBar').style.width = Math.max(0, hpPercent) + '%';
            document.getElementById('xpBar').style.width = Math.min(100, Math.max(0, xpPercent)) + '%';
            document.getElementById('healBar').style.width = healPercent + '%';
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('lvlVal').innerText = level;
            let className = currentClass;
            if (evolvedForm) className += ` (${evolvedForm})`;
            document.getElementById('classLabel').innerText = className;
            let evoMsg = (level >= 25 && !evolvedForm) ? "LVL 25: CLASS EVOLUTION READY!" : (evolvedForm ? `${evolvedForm} ACTIVE` : "");
            document.getElementById('evoHint').innerHTML = evoMsg + ` | REGEN: ${(baseHealingPerSecond * 100).toFixed(1)}%/s`;

            if (currentPowerup === "bomb") powerupDisplay.innerHTML = "BOMB (⚡)";
            else if (currentPowerup === "health") powerupDisplay.innerHTML = "HEALTH (⚡)";
            else if (currentPowerup === "invincible") powerupDisplay.innerHTML = "INVINCIBLE (⚡)";
            else powerupDisplay.innerHTML = "NO POWERUP";
        }

        function applyHealing(now) {
            if (!player || player.hp <= 0 || player.hp >= player.maxHp || gamePaused) return;
            if (!lastHealTimestamp) lastHealTimestamp = now;
            let delta = Math.min(0.1, (now - lastHealTimestamp) / 1000);
            if (delta > 0 && baseHealingPerSecond > 0) {
                let healAmount = baseHealingPerSecond * delta * (player.maxHp / 100);
                if (healAmount > 0 && player.hp < player.maxHp) {
                    player.hp = Math.min(player.maxHp, player.hp + healAmount);
                    updateUI();
                }
            }
            lastHealTimestamp = now;
        }

        function spawnPowerup(now) {
            if (!running || gamePaused) return;
            if (!nextPowerupSpawn) nextPowerupSpawn = now + 10000;
            if (now >= nextPowerupSpawn && !powerupObject) {
                let types = ["bomb", "health", "invincible"];
                let randomType = types[Math.floor(Math.random() * 3)];
                powerupObject = { x: Math.random() * (canvas.width - 60) + 30, y: Math.random() * (canvas.height - 60) + 30,
                    type: randomType };
                nextPowerupSpawn = now + 10000;
            }
        }

        function usePowerup() {
            if (!currentPowerup || gamePaused) return;
            if (currentPowerup === "bomb") {
                enemies = [];
                if (boss) { boss.hp -= 200; if (boss.hp <= 0) { boss = null;
                        score += 55;
                        xp += 45;
                        updateUI(); } }
                currentPowerup = null;
            } else if (currentPowerup === "health") {
                let healAmount = player.maxHp * 0.1;
                player.hp = Math.min(player.maxHp, player.hp + healAmount);
                currentPowerup = null;
                updateUI();
            } else if (currentPowerup === "invincible") {
                invincibleFrames = invincibleDuration;
                currentPowerup = null;
            }
            updateUI();
        }

        function collectPowerup() {
            if (!powerupObject || gamePaused) return;
            let dist = Math.hypot(player.x - powerupObject.x, player.y - powerupObject.y);
            if (dist < player.size + 12) {
                currentPowerup = powerupObject.type;
                powerupObject = null;
                updateUI();
            }
        }

        // ---------- UPGRADE / EVOLUTION ----------
        function showUpgradeMenu() {
            if (!running) return;
            gamePaused = true;
            overlay.classList.remove('hidden');
            overlay.innerHTML = `
                <h2>UPGRADE (max ${MAX_UPGRADE_LEVEL})</h2>
                <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
                    <button class="btn" id="upgDmg">DAMAGE +0.1 (${upgradeLevels.damage}/${MAX_UPGRADE_LEVEL})</button>
                    <button class="btn" id="upgRate">FIRE RATE +0.1 (${upgradeLevels.fireRate}/${MAX_UPGRADE_LEVEL})</button>
                    <button class="btn" id="upgSpd">SPEED +0.1 (${upgradeLevels.speed}/${MAX_UPGRADE_LEVEL})</button>
                    <button class="btn" id="upgBullet">BULLET SPD +0.8 (${upgradeLevels.bulletSpeed}/${MAX_UPGRADE_LEVEL})</button>
                    <button class="btn" id="upgHeal">HEALING +0.05/s (${healingUpgradeLevel}/${MAX_HEALING_UPGRADE})</button>
                </div>
                <div class="subnote">Each upgrade increases stats. Healing stacks up to 0.25/s</div>
                <button class="btn" id="closeUpgradeBtn" style="margin-top:15px;">CLOSE</button>
            `;
            document.getElementById('upgDmg').onclick = () => { if (upgradeLevels.damage < MAX_UPGRADE_LEVEL) { upgrades.damage += 0.1;
                    upgradeLevels.damage++; } closeUpgrade(); };
            document.getElementById('upgRate').onclick = () => { if (upgradeLevels.fireRate < MAX_UPGRADE_LEVEL) { upgrades
                        .fireRate += 0.1;
                    upgradeLevels.fireRate++; } closeUpgrade(); };
            document.getElementById('upgSpd').onclick = () => { if (upgradeLevels.speed < MAX_UPGRADE_LEVEL) { upgrades.speed +=
                    0.1;
                    upgradeLevels.speed++; } closeUpgrade(); };
            document.getElementById('upgBullet').onclick = () => { if (upgradeLevels.bulletSpeed < MAX_UPGRADE_LEVEL) { upgrades
                        .bulletSpeed += 0.8;
                    upgradeLevels.bulletSpeed++; } closeUpgrade(); };
            document.getElementById('upgHeal').onclick = () => { if (healingUpgradeLevel < MAX_HEALING_UPGRADE) { healingUpgradeLevel++;
                    baseHealingPerSecond = healingUpgradeLevel * 0.05;
                    updateUI(); } closeUpgrade(); };
            document.getElementById('closeUpgradeBtn').onclick = closeUpgrade;
        }

        function closeUpgrade() {
            overlay.classList.add('hidden');
            gamePaused = false;
        }

        function showEvolutionChoice() {
            if (evolvedForm) return;
            gamePaused = true;
            if (player) { player.hp = player.maxHp;
                updateUI(); }
            overlay.classList.remove('hidden');
            let choiceHtml = "";
            if (currentClass === "Assault") {
                choiceHtml = `<h2>CLASS EVOLUTION (Lv.25)</h2>
                <div><button class="btn" id="evoMachine">MACHINE GUN (spray)</button> <span style="margin:0 8px">or</span> <button class="btn" id="evoDouble">DOUBLE GUNNER</button></div>
                <div class="subnote">Machine gun: random spray bullets | Double Gunner: twin shots</div>`;
            } else if (currentClass === "Sniper") {
                choiceHtml = `<h2>SNIPER ASCENSION</h2>
                <div><button class="btn" id="evoGiant">GIANT SNIPER (big projectile)</button> <span style="margin:0 8px">or</span> <button class="btn" id="evoHoming">HOMING MISSILES</button></div>
                <div class="subnote">Giant: larger piercing | Homing: lower cooldown + tracking</div>`;
            } else {
                choiceHtml = `<h2>TANK METAMORPHOSIS</h2>
                <div><button class="btn" id="evoTiger">TIGER TANK (2x HP)</button> <span style="margin:0 8px">or</span> <button class="btn" id="evoStationary">STATIONARY TANK (slow + dmg)</button></div>
                <div class="subnote">Tiger: double health pool | Stationary: slower but massive damage</div>`;
            }
            overlay.innerHTML = choiceHtml + `<div style="margin-top:12px;"><button class="btn" id="cancelEvo">Later</button></div>`;
            if (currentClass === "Assault") {
                document.getElementById("evoMachine")?.addEventListener("click", () => { applyEvolution("Machine Gun"); });
                document.getElementById("evoDouble")?.addEventListener("click", () => { applyEvolution("Double Gunner"); });
            } else if (currentClass === "Sniper") {
                document.getElementById("evoGiant")?.addEventListener("click", () => { applyEvolution("Giant Sniper"); });
                document.getElementById("evoHoming")?.addEventListener("click", () => { applyEvolution("Homing"); });
            } else if (currentClass === "Tank") {
                document.getElementById("evoTiger")?.addEventListener("click", () => { applyEvolution("Tiger Tank"); });
                document.getElementById("evoStationary")?.addEventListener("click", () => { applyEvolution("Stationary Tank"); });
            }
            document.getElementById("cancelEvo")?.addEventListener("click", () => { closeEvolutionLater(); });
        }

        function applyEvolution(evolution) {
            evolvedForm = evolution;
            if (evolution === "Tiger Tank") { player.maxHp = player.maxHp * 2;
                player.hp = player.maxHp;
                updateUI(); } else if (evolution === "Stationary Tank") { player.speed = Math.max(0.9, player.speed * 0.55);
                player.dmg = player.dmg * 2.2; } else if (evolution === "Homing") { player.cd = player.cd * 0.65; }
            overlay.classList.add('hidden');
            gamePaused = false;
            updateUI();
        }

        function closeEvolutionLater() {
            overlay.classList.add('hidden');
            gamePaused = false;
        }

        // ---------- QUIZ ----------
        function showSafetyQuiz(onResult) {
            gamePaused = true;
            const q = safetyQuestions[currentQuizIndex % safetyQuestions.length];
            currentQuizIndex++;
            let answerLock = false;
            let wasCorrect = false;
            overlay.classList.remove('hidden');
            overlay.innerHTML = `
                <div class="quiz-container">
                    <h2 style="color:#1E3B4F;">Safety Check</h2>
                    <div class="quiz-question">${q.text}</div>
                    <div class="quiz-options" id="quizOptions"></div>
                    <div id="quizFeedback" class="quiz-feedback" style="display:none;"></div>
                    <button id="quizContinueBtn" style="display:none;" class="btn">Continue</button>
                </div>
            `;
            const optionsDiv = document.getElementById("quizOptions");
            q.options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.textContent = opt;
                btn.className = "quiz-btn";
                btn.onclick = () => {
                    if (answerLock) return;
                    answerLock = true;
                    const isCorrect = (idx === q.correctIndex);
                    wasCorrect = isCorrect;
                    const feedbackDiv = document.getElementById("quizFeedback");
                    feedbackDiv.style.display = "block";
                    if (isCorrect) {
                        feedbackDiv.innerHTML =
                            `<strong>CORRECT!</strong> ${q.correctMsg}<br><em>Safety rule: ${q.explanation}</em>`;
                        document.querySelectorAll(".quiz-btn").forEach(b => b.disabled = true);
                        if (idx === q.correctIndex) btn.classList.add("correct-feedback");
                        else document.querySelectorAll(".quiz-btn")[q.correctIndex]?.classList.add("correct-feedback");
                    } else {
                        feedbackDiv.innerHTML =
                            `<strong>WRONG!</strong> The safest choice: "${q.options[q.correctIndex]}".<br><em>${q.explanation}</em><br><span style="color:#cc3300; font-weight:bold;">⚠️ PENALTY: You lose 10 HP!</span>`;
                        btn.classList.add("wrong-feedback");
                        document.querySelectorAll(".quiz-btn")[q.correctIndex]?.classList.add("correct-feedback");
                        document.querySelectorAll(".quiz-btn").forEach(b => b.disabled = true);
                    }
                    const contBtn = document.getElementById("quizContinueBtn");
                    contBtn.style.display = "inline-block";
                    contBtn.onclick = () => {
                        overlay.classList.add('hidden');
                        gamePaused = false;
                        onResult(wasCorrect);
                    };
                };
                optionsDiv.appendChild(btn);
            });
        }

        function handleLevelUp() {
            if (!running) return;
            const evolutionReady = (level === 15 && !evolvedForm);
            showSafetyQuiz((isCorrect) => {
                if (!isCorrect && player) {
                    player.hp = Math.max(0, player.hp - 10);
                    updateUI();
                    if (player.hp <= 0) {
                        running = false;
                        gamePaused = false;
                        showGameOver();
                        return;
                    }
                }
                if (isCorrect) {
                    if (evolutionReady) {
                        showEvolutionChoice();
                    } else {
                        showUpgradeMenu();
                    }
                } else {
                    gamePaused = false;
                }
            });
        }

        // ---------- SHOOTING & GAME MECHANICS ----------
        function shoot() {
            if (!running || gamePaused || !player) return;
            let now = performance.now();
            let fireDelay = player.cd / (upgrades.fireRate || 1);
            if (now - lastShot < fireDelay) return;
            lastShot = now;
            let baseDmg = player.dmg * upgrades.damage;
            let dx = mouse.x - player.x,
                dy = mouse.y - player.y;
            let len = Math.hypot(dx, dy) || 1;
            let normX = dx / len,
                normY = dy / len;
            if (evolvedForm === "Double Gunner") {
                let angle = Math.atan2(dy, dx);
                let offset = 0.2;
                bullets.push({ x: player.x, y: player.y, dx: Math.cos(angle - offset), dy: Math.sin(angle - offset),
                    dmg: baseDmg * 0.9, size: 6, homing: false, giant: false });
                bullets.push({ x: player.x, y: player.y, dx: Math.cos(angle + offset), dy: Math.sin(angle + offset),
                    dmg: baseDmg * 0.9, size: 6, homing: false, giant: false });
            } else if (evolvedForm === "Machine Gun") {
                for (let i = 0; i < 3; i++) { let spread = (Math.random() - 0.5) * 0.7; let angleSpread = Math.atan2(dy,
                        dx) + spread; bullets.push({ x: player.x, y: player.y, dx: Math.cos(angleSpread),
                        dy: Math.sin(angleSpread), dmg: baseDmg * 0.7, size: 5, homing: false, giant: false }); }
            } else if (evolvedForm === "Giant Sniper") {
                bullets.push({ x: player.x, y: player.y, dx: normX, dy: normY, dmg: baseDmg * 1.9, size: 14,
                    homing: false, giant: true });
            } else if (evolvedForm === "Homing") {
                bullets.push({ x: player.x, y: player.y, dx: normX, dy: normY, dmg: baseDmg * 1.2, size: 7,
                    homing: true, homingTarget: null, giant: false });
            } else {
                bullets.push({ x: player.x, y: player.y, dx: normX, dy: normY, dmg: baseDmg, size: 6, homing: false,
                    giant: false });
            }
            if (!evolvedForm || (evolvedForm !== "Double Gunner" && evolvedForm !== "Machine Gun" && evolvedForm !==
                    "Giant Sniper" && evolvedForm !== "Homing")) {
                bullets.push({ x: player.x, y: player.y, dx: normX, dy: normY, dmg: baseDmg, size: 6, homing: false,
                    giant: false });
            }
        }

        function spawnEnemy() { let hpScale = 28 + Math.floor(level * 1.5); enemies.push({ x: Math.random() * canvas.width,
                y: Math.random() * canvas.height, hp: hpScale, maxHp: hpScale, size: 12, speed: 1.4 + level * 0.025,
                dmg: 6 }); }

        function trySpawnBoss(now) { if (boss) return; if (lastBossDeathTime > 0 && (now - lastBossDeathTime) < 10000)
                return; if (score >= 16 && !boss) { let multiplier = 1 + (level / 16); let finalHp = Math.floor(
                bossBaseHp * multiplier); let finalDmg = Math.floor(bossDamage * (1 + level / 21)); boss = { x: canvas
                    .width / 2, y: 100, size: 48, hp: finalHp, maxHp: finalHp, speed: 0.85 + level * 0.02,
                dmg: finalDmg, shootTimer: 0 }; } }

        function bossShoot() { if (!boss || !running || gamePaused || !player) return; let dx = player.x - boss.x,
                dy = player.y - boss.y; let len = Math.hypot(dx, dy) || 1; bossProjectiles.push({ x: boss.x, y: boss.y,
                dx: dx / len, dy: dy / len, dmg: boss.dmg, size: 8, speed: 3.8 }); }

        function updateGame(now) {
            if (!running || gamePaused) return;
            applyHealing(now);
            spawnPowerup(now);
            collectPowerup();
            trySpawnBoss(now);
            if (invincibleFrames > 0) invincibleFrames--;

            let mx = 0,
                my = 0;
            if (controlMode === 'mobile') {
                if (joystickActive) {
                    mx = joystickDX;
                    my = joystickDY;
                }
            } else {
                if (keys["w"] || keys["arrowup"]) my -= 1;
                if (keys["s"] || keys["arrowdown"]) my += 1;
                if (keys["a"] || keys["arrowleft"]) mx -= 1;
                if (keys["d"] || keys["arrowright"]) mx += 1;
            }
            if (mx !== 0 || my !== 0) { let len = Math.hypot(mx, my);
                mx /= len;
                my /= len;
                player.x += mx * player.speed * upgrades.speed;
                player.y += my * player.speed * upgrades.speed; }
            let margin = player.size + 3;
            player.x = Math.min(Math.max(margin, player.x), canvas.width - margin);
            player.y = Math.min(Math.max(margin, player.y), canvas.height - margin);

            // Aim
            if (controlMode === 'mobile') {
                if (joystickActive && (Math.abs(joystickDX) > 0.1 || Math.abs(joystickDY) > 0.1)) {
                    mouse.x = player.x + joystickDX * 100;
                    mouse.y = player.y + joystickDY * 100;
                }
                // else keep last mouse
            }
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            if (shootHeld) shoot();
            if (enemies.length < 14 && Math.random() < 0.022) spawnEnemy();

            // Bullet collisions
            for (let i = 0; i < bullets.length; i++) {
                let b = bullets[i];
                let spd = 6.5 + (upgrades.bulletSpeed || 0);
                if (b.giant) spd = 5.8;
                b.x += b.dx * spd;
                b.y += b.dy * spd;
                if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) { bullets.splice(i,
                        1);
                    i--; continue; }
                let hit = false;
                for (let j = 0; j < enemies.length; j++) {
                    let e = enemies[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < e.size + (b.giant ? 10 : 6)) {
                        e.hp -= b.dmg;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) { enemies.splice(j, 1);
                            score++;
                            xp += 12;
                            updateUI(); }
                        hit = true;
                        break;
                    }
                }
                if (hit) { i--; continue; }
                if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.size + 7) {
                    boss.hp -= b.dmg;
                    bullets.splice(i, 1);
                    if (boss.hp <= 0) { boss = null;
                        lastBossDeathTime = now;
                        score += 55;
                        xp += 45;
                        updateUI(); }
                    i--;
                    continue;
                }
            }

            for (let e of enemies) {
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if (dist < e.size + player.size && invincibleFrames <= 0) { player.hp -= 0.5; if (player.hp <= 0) { running =
                            false;
                        showGameOver(); return; } updateUI(); }
                let dxp = player.x - e.x,
                    dyp = player.y - e.y;
                let lenE = Math.hypot(dxp, dyp) || 1;
                e.x += (dxp / lenE) * e.speed;
                e.y += (dyp / lenE) * e.speed;
            }
            if (boss) {
                let dxB = player.x - boss.x,
                    dyB = player.y - boss.y;
                let lenB = Math.hypot(dxB, dyB) || 1;
                boss.x += (dxB / lenB) * boss.speed;
                boss.y += (dyB / lenB) * boss.speed;
                boss.x = Math.min(Math.max(25, boss.x), canvas.width - 25);
                boss.y = Math.min(Math.max(40, boss.y), canvas.height - 50);
                if (Math.hypot(player.x - boss.x, player.y - boss.y) < boss.size + player.size && invincibleFrames <=
                    0) { player.hp -= boss.dmg * 0.65; if (player.hp <= 0) { running = false;
                        showGameOver(); return; } updateUI(); }
                if (boss.shootTimer <= 0) { bossShoot();
                    boss.shootTimer = 40; } else boss.shootTimer--;
            }
            for (let i = 0; i < bossProjectiles.length; i++) {
                let p = bossProjectiles[i];
                p.x += p.dx * p.speed;
                p.y += p.dy * p.speed;
                if (p.x < -30 || p.x > canvas.width + 30 || p.y < -30 || p.y > canvas.height + 30) { bossProjectiles
                        .splice(i, 1);
                    i--; continue; }
                if (Math.hypot(p.x - player.x, p.y - player.y) < player.size + 7 && invincibleFrames <= 0) {
                    player.hp -= p.dmg;
                    bossProjectiles.splice(i, 1);
                    if (player.hp <= 0) { running = false;
                        showGameOver(); return; }
                    updateUI();
                    i--;
                }
            }
            while (xp >= 50 && running && !gamePaused) { xp -= 50;
                level++;
                updateUI();
                handleLevelUp(); if (gamePaused) break; if (!running) return; }
            if (player.hp <= 0) { running = false;
                showGameOver(); }
        }

        function showGameOver() {
            gamePaused = true;
            overlay.classList.remove('hidden');
            overlay.innerHTML =
                `<h2>GAME OVER</h2><div>Score: ${score} | Level ${level}</div><button class="btn btn-red" id="restartGameOverBtn">RESTART</button>`;
            document.getElementById("restartGameOverBtn").addEventListener("click", () => { fullGameRestart(); });
        }

            bossProjectiles = [];

            xp = 0;
            level = 1;
            upgrades = { damage: 1, fireRate: 1, speed: 1, bulletSpeed: 1 };
            upgradeLevels = { damage: 0, fireRate: 0, speed: 0, bulletSpeed: 0 };

            baseHealingPerSecond = 0;
            evolvedForm = null;
            currentPowerup = null;
            powerupObject = null;
            invincibleFrames = 0;
            lastBossDeathTime = 0;
            nextPowerupSpawn = 0;
            currentQuizIndex = 0;
            showMainMenu();
        }

            else if (className === "Sniper") baseStats = { hp: 75, maxHp: 75, spd: 2.6, cd: 480, dmg: 27 };
            else baseStats = { hp: 280, maxHp: 280, spd: 2.1, cd: 340, dmg: 9 };

        function showInstructionManualThenStart(className) {

                'Move: left joystick | Shoot: SHOOT button | Powerup: ⚡' :

        // ---------- MAIN MENU ----------
        function showMainMenu() {

            restartBtn.classList.add('hidden');

            overlay.classList.remove('hidden');
            overlay.innerHTML = `

                    <button class="btn btn-sm" id="modeMobileBtn">📱 MOBILE</button>
                </div>
                <div style="margin-top:4px; font-size:0.5rem; color:#4a6a4a;">Current mode: <span id="currentModeLabel">WEB</span></div>
            `;

            // Set current mode
            if (!controlMode) controlMode = 'web';
            document.getElementById('currentModeLabel').innerText = controlMode.toUpperCase();

            document.getElementById("classAssaultBtn").onclick = () => { showInstructionManualThenStart("Assault"); };
            document.getElementById("classSniperBtn").onclick = () => { showInstructionManualThenStart("Sniper"); };
            document.getElementById("classTankBtn").onclick = () => { showInstructionManualThenStart("Tank"); };

            document.getElementById("modeWebBtn").onclick = () => {
                controlMode = 'web';
                document.getElementById('currentModeLabel').innerText = 'WEB';
                touchControls.classList.remove('active');
            };
            document.getElementById("modeMobileBtn").onclick = () => {
                controlMode = 'mobile';
                document.getElementById('currentModeLabel').innerText = 'MOBILE';
                touchControls.classList.add('active');
            };

            document.getElementById("showClassesBtn").onclick = showClassesMenu;
            document.getElementById("rulesBtn").onclick = showRulesMenu;
            document.getElementById("skinsBtn").onclick = showSkinsMenu;
        }

        function showClassesMenu() {
            overlay.innerHTML = `
                <h2>CLASS INFO</h2>
                <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">
                    <div class="class-card"><h3>ASSAULT</h3><div class="class-stats">HP:110 | Speed:3.2 | Dmg:11</div><div class="class-stats">Evo: Machine Gun / Double</div></div>
                    <div class="class-card"><h3>SNIPER</h3><div class="class-stats">HP:75 | Speed:2.6 | Dmg:27</div><div class="class-stats">Evo: Giant / Homing</div></div>
                    <div class="class-card"><h3>TANK</h3><div class="class-stats">HP:280 | Speed:2.1 | Dmg:9</div><div class="class-stats">Evo: Tiger / Stationary</div></div>
                </div>
                <button class="btn" id="backMain">BACK</button>
            `;
            document.getElementById("backMain").onclick = showMainMenu;
        }

        function showRulesMenu() {
            overlay.innerHTML = `
                <h2>RULES</h2>
                <div class="rules-panel" style="background:rgba(0,0,0,0.6);border-radius:16px;padding:12px;border:1px solid #ffaa44;max-width:400px;font-size:0.6rem;text-align:left;color:#ddd;">
                    • Kill enemies to gain XP.<br>
                    • Level up → Safety Quiz (correct = upgrade, wrong = -10 HP).<br>
                    • Boss at score 16. Powerups every 10s (Bomb, Heal, Invincible).<br>
                    • Use powerups wisely!
                </div>
                <button class="btn" id="backMain2">BACK</button>
            `;
            document.getElementById("backMain2").onclick = showMainMenu;
        }

        function showSkinsMenu() {
            overlay.innerHTML = `
                <h2>SKINS</h2>
                <div class="skin-grid">
                    <div class="skin-dot" style="background:#42f5aa;" data-skin="blue"></div>
                    <div class="skin-dot" style="background:#ff5555;" data-skin="red"></div>
                    <div class="skin-dot" style="background:#55ff55;" data-skin="green"></div>
                    <div class="skin-dot" style="background:#ffdd44;" data-skin="yellow"></div>
                </div>
                <button class="btn" id="backMain3">BACK</button>
            `;
            document.querySelectorAll('.skin-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    setSkin(dot.dataset.skin);
                    showSkinsMenu(); // refresh to show active
                });
                if (dot.dataset.skin === currentSkin) dot.classList.add('active');
            });
            document.getElementById("backMain3").onclick = showMainMenu;
        }

        // ---------- DRAW ----------
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1d2c1a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (powerupObject) {
                ctx.fillStyle = powerupObject.type === "bomb" ? "#ff4444" : (powerupObject.type === "health" ? "#44ff44" :
                    "#ffaa44");
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(powerupObject.x, powerupObject.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.font = "bold 16px monospace";
                let letter = powerupObject.type === "bomb" ? "B" : (powerupObject.type === "health" ? "H" : "I");
                ctx.fillText(letter, powerupObject.x - 5, powerupObject.y + 6);
                ctx.shadowBlur = 0;
            }

            for (let e of enemies) {
                ctx.fillStyle = "#d64531";
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#b82b1a";
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.font = "bold 12px monospace";
                ctx.fillText(Math.floor(e.hp), e.x - 12, e.y - 8);
            }

            if (boss) {
                ctx.fillStyle = "#b0306e";
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff66aa";
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.size - 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "white";
                ctx.font = "bold 20px monospace";
                ctx.fillText(`BOSS ${Math.floor(boss.hp)}/${boss.maxHp}`, boss.x - 55, boss.y - 35);
                ctx.fillStyle = "orange";
                ctx.fillRect(boss.x - 50, boss.y - 50, 100 * (boss.hp / boss.maxHp), 10);
                ctx.shadowBlur = 0;
            }

            for (let p of bossProjectiles) {
                ctx.fillStyle = "#ff884d";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#ff4400";
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let b of bullets) {
                ctx.fillStyle = b.giant ? "#ffee88" : "#ffd966";
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size ? b.size - 2 : 5, 0, Math.PI * 2);
                ctx.fill();
            }

            if (player) {
                let skin = skinColors[currentSkin] || skinColors.blue;
                ctx.save();
                ctx.translate(player.x, player.y);
                if (invincibleFrames > 0 && (Math.floor(Date.now() / 50) % 2 === 0)) { ctx.fillStyle = "#ffff88"; } else { ctx
                        .fillStyle = skin.main; }
                ctx.beginPath();
                ctx.arc(0, 0, player.size - 1, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = skin.dark;
                ctx.beginPath();
                ctx.arc(0, 0, player.size - 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.rotate(player.angle);
                ctx.fillStyle = skin.light;
                ctx.fillRect(14, -4, 16, 8);
                ctx.restore();
                let hpPercent = player.hp / player.maxHp;
                ctx.fillStyle = "#4a2a2a";
                ctx.fillRect(player.x - 20, player.y - 22, 40, 6);
                ctx.fillStyle = "#f55c5c";
                ctx.fillRect(player.x - 20, player.y - 22, 40 * hpPercent, 5);
            }
        }

        // ---------- TOUCH EVENTS (mobile) ----------
        const joystickArea = document.getElementById('joystickArea');
        const joystickKnob = document.getElementById('joystickKnob');
        const shootBtnTouch = document.getElementById('shootBtn');
        const powerupBtnTouch = document.getElementById('powerupBtn');

        let joystickTouchId = null;
        joystickArea.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (controlMode !== 'mobile') return;
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            joystickActive = true;
            updateJoystick(touch);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (joystickTouchId !== null && controlMode === 'mobile') {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === joystickTouchId);
                if (touch) updateJoystick(touch);
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (joystickTouchId !== null && controlMode === 'mobile') {
                const touch = Array.from(e.changedTouches).find(t => t.identifier === joystickTouchId);
                if (touch) {
                    joystickActive = false;
                    joystickDX = 0;
                    joystickDY = 0;
                    joystickKnob.style.transform = 'translate(0,0)';
                    joystickTouchId = null;
                }
            }
        }, { passive: false });

        function updateJoystick(touch) {
            const rect = joystickArea.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = touch.clientX - cx;
            const dy = touch.clientY - cy;
            const maxDist = rect.width / 2 - 10;
            const dist = Math.min(Math.hypot(dx, dy), maxDist);
            const angle = Math.atan2(dy, dx);
            const normX = Math.cos(angle);
            const normY = Math.sin(angle);
            const clampedX = normX * dist;
            const clampedY = normY * dist;
            joystickKnob.style.transform = `translate(${clampedX}px, ${clampedY}px)`;
            if (maxDist > 0) {
                joystickDX = (clampedX / maxDist);
                joystickDY = (clampedY / maxDist);
            } else {
                joystickDX = 0;
                joystickDY = 0;
            }
            if (Math.abs(joystickDX) < 0.1) joystickDX = 0;
            if (Math.abs(joystickDY) < 0.1) joystickDY = 0;
        }

        shootBtnTouch.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (controlMode === 'mobile') {
                shootHeld = true;
                // update mouse aim to touch position relative to canvas
                const rect = canvas.getBoundingClientRect();
                const touch = e.changedTouches[0];
                const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
                const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
                mouse.x = Math.min(Math.max(0, x), canvas.width);
                mouse.y = Math.min(Math.max(0, y), canvas.height);
            }
        }, { passive: false });
        shootBtnTouch.addEventListener('touchend', (e) => { e.preventDefault();
            shootHeld = false; }, { passive: false });
        shootBtnTouch.addEventListener('touchcancel', (e) => { shootHeld = false; }, { passive: false });

        powerupBtnTouch.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (controlMode === 'mobile') usePowerup();
        }, { passive: false });

        // ---------- KEYBOARD (web) ----------
        window.addEventListener('keydown', (e) => {
            let key = e.key.toLowerCase();
            keys[key] = true;
            if (key === " " || key === "space") { e.preventDefault(); if (controlMode === 'web') shoot(); }
            if (key === "e") { e.preventDefault(); if (controlMode === 'web') usePowerup(); }
        });
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Mouse (web)
        canvas.addEventListener('mousemove', (e) => {
            if (controlMode === 'web') {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                mouse.x = Math.min(Math.max(0, x), canvas.width);
                mouse.y = Math.min(Math.max(0, y), canvas.height);
            }
        });
        canvas.addEventListener('mousedown', (e) => { e.preventDefault(); if (controlMode === 'web') { shootHeld = true;
                canvas.focus(); } });
        window.addEventListener('mouseup', () => { shootHeld = false; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Restart button
        restartBtn.addEventListener('click', () => { fullGameRestart(); });

        // ---------- GAME LOOP ----------
        function gameLoop(time) {
            updateGame(time);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- INIT ----------
        showMainMenu();
        gameLoop();
    })();
</script>
</body>
</html>
