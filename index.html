<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Safety Shooter · Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0c0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            padding: 12px;
            margin: 0;
            touch-action: none;
        }
        /* ---------- CRT MONITOR FRAME ---------- */
        .crt-wrapper {
            position: relative;
            width: 100%;
            max-width: 820px;
            aspect-ratio: 4 / 3;
            background: #1a1a1a;
            border-radius: 36px 36px 28px 28px;
            padding: 18px 18px 38px 18px;
            box-shadow: 0 0 0 2px #2a2a2a, 0 0 0 6px #111, 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(0, 20, 0, 0.6);
        }
        .crt-wrapper::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: #222;
            border-radius: 40px;
            box-shadow: inset 0 2px 4px #000, 0 0 4px #0f0f0f;
        }
        .crt-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0d130d;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 30, 0, 0.5), 0 0 0 1px #2f3f2f;
        }
        .scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.15) 2px, rgba(0, 0, 0, 0.15) 4px);
            border-radius: 20px;
            mix-blend-mode: multiply;
        }
        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7) 100%);
        }
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(20, 60, 30, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 60, 30, 0.15) 1px, transparent 1px);
            background-size: 32px 32px;
            border-radius: 20px;
            z-index: 0;
        }

        /* ---------- OVERLAY & UI ---------- */
        #overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(12px);
            z-index: 30;
            border-radius: 20px;
            padding: 20px;
            transition: 0.2s;
            overflow-y: auto;
            text-align: center;
            color: #f0f0f0;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay h2 {
            color: #7cfc9e;
            text-shadow: 0 0 10px #1faa3a;
            margin-bottom: 12px;
            font-size: clamp(1.2rem, 3vw, 2rem);
            letter-spacing: 2px;
        }
        .btn {
            background: #2c2f3a;
            border: none;
            color: white;
            font-weight: bold;
            font-size: clamp(0.7rem, 1.2vw, 1rem);
            padding: 8px 20px;
            margin: 6px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.1s linear;
            box-shadow: 0 3px 0 #0f0f17;
            font-family: monospace;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #4a5a72;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #0f0f17;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f0f17;
        }
        .btn-green {
            background: radial-gradient(circle at 30% 30%, #3cdb6a, #1a8a3a);
            color: #0a1a0a;
            box-shadow: 0 0 0 3px #3a7a4a, 0 0 30px rgba(60, 255, 120, 0.3);
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            padding: 12px 32px;
            animation: pulse-glow 2.2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% { box-shadow: 0 0 0 3px #3a7a4a, 0 0 30px rgba(60, 255, 120, 0.3); }
            50% { box-shadow: 0 0 0 4px #5a9a6a, 0 0 50px rgba(60, 255, 120, 0.5); }
        }
        .btn-red {
            background: #b53b3b;
            box-shadow: 0 4px 0 #631e1e;
        }
        .btn-sm {
            font-size: 0.7rem;
            padding: 4px 14px;
        }
        .mode-grid {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }
        .mode-btn {
            background: #1a2a1a;
            border: 2px solid #3a6a4a;
            border-radius: 20px;
            padding: 14px 22px;
            min-width: 120px;
            cursor: pointer;
            transition: 0.12s;
            color: #7cfc9e;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            text-align: center;
            box-shadow: inset 0 0 20px rgba(0, 40, 0, 0.2);
            text-decoration: none;
            display: inline-block;
            background: #0f1a0f;
        }
        .mode-btn:hover {
            transform: scale(1.04);
            border-color: #7cfc9e;
            background: #1f3a2a;
        }
        .mode-btn .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }
        .subnote {
            font-size: 0.55rem;
            opacity: 0.7;
            margin-top: 12px;
        }
        .class-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .class-card {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            margin: 4px;
            text-align: center;
            min-width: 100px;
        }
        .class-stats {
            font-size: 0.5rem;
            color: #aaa;
        }
        .instruction-manual {
            background: #0f172ad9;
            backdrop-filter: blur(12px);
            border: 2px solid #ffcc77;
            border-radius: 24px;
            padding: 16px;
            max-width: 480px;
            text-align: left;
            color: #f0f0f0;
            font-family: monospace;
            font-size: 0.7rem;
            line-height: 1.8;
            margin: 10px 0;
        }
        .instruction-manual ul {
            padding-left: 20px;
            list-style: none;
        }
        .instruction-manual li::before {
            content: "▸ ";
            color: #ffcc77;
        }
        .warning-text {
            color: #ffaa66;
            font-weight: bold;
        }
        /* ---------- SKINS ---------- */
        .skin-grid {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .skin-dot {
            width: clamp(40px, 6vw, 56px);
            height: clamp(40px, 6vw, 56px);
            border-radius: 50%;
            border: 3px solid #2a4a3a;
            cursor: pointer;
            transition: 0.12s;
            box-shadow: 0 0 0 1px #1a2a1a, inset 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .skin-dot:hover {
            transform: scale(1.1);
            border-color: #7cfc9e;
        }
        .skin-dot.active {
            border-color: #ffd966;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* ---------- CANVAS ---------- */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1e2a1a;
            touch-action: none;
            cursor: crosshair;
        }

        /* ---------- UI OVERLAY (in-game HUD) ---------- */
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            border-left: 3px solid #ff7e5e;
            font-weight: bold;
            font-size: 10px;
            letter-spacing: 0.5px;
            pointer-events: none;
            font-family: monospace;
            min-width: 140px;
            color: #eee;
        }
        #hud .bar {
            width: 100px;
            height: 5px;
            background: #2b2b2b;
            border-radius: 10px;
            overflow: hidden;
            margin: 2px 0 4px 0;
        }
        #hud .fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.1s ease;
        }
        #hpBar { background: #e34d4d; }
        #xpBar { background: #3cc7f2; box-shadow: 0 0 4px #00ccff; }
        #healBar { background: #2ecc71; box-shadow: 0 0 3px #2ecc71; width: 0%; }
        .hud-row {
            display: flex;
            gap: 8px;
            font-size: 9px;
            flex-wrap: wrap;
        }
        #powerupDisplay {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: bold;
            font-family: monospace;
            border: 1px solid gold;
            color: #fff;
            pointer-events: none;
        }
        #restartBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 25;
            background: #000000aa;
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid #ffaa66;
            font-family: monospace;
            font-size: 11px;
            color: #ffcc99;
            transition: 0.1s;
        }
        #restartBtn:active {
            background: #b53b3b;
            transform: scale(0.95);
        }

        /* ---------- TOUCH CONTROLS ---------- */
        .touch-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            pointer-events: none;
            z-index: 15;
            touch-action: none;
            display: none;
            /* hidden by default, shown in mobile mode */;
        }
        .touch-controls.active {
            display: block;
        }
        .joystick-area {
            position: absolute;
            left: 10px;
            bottom: 10px;
            width: 100px;
            height: 100px;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joystick-knob {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            transform: translate(0, 0);
            transition: none;
            will-change: transform;
        }
        .shoot-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 70px;
            height: 70px;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
            background: rgba(255, 60, 60, 0.4);
            border: 3px solid #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black;
            backdrop-filter: blur(4px);
        }
        .shoot-btn:active {
            background: rgba(255, 60, 60, 0.8);
            transform: scale(0.92);
        }
        .powerup-touch {
            position: absolute;
            right: 10px;
            bottom: 90px;
            width: 44px;
            height: 44px;
            pointer-events: auto;
            touch-action: manipulation;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.4);
            border: 2px solid gold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            text-shadow: 0 0 10px black;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }
        .powerup-touch:active {
            background: rgba(255, 215, 0, 0.8);
            transform: scale(0.9);
        }
        @media (max-width: 500px) {
            .joystick-area { width: 80px; height: 80px; left: 6px; bottom: 6px; }
            .joystick-knob { width: 32px; height: 32px; }
            .shoot-btn { width: 56px; height: 56px; right: 6px; bottom: 6px; font-size: 12px; }
            .powerup-touch { width: 36px; height: 36px; right: 6px; bottom: 72px; font-size: 14px; }
            #hud { font-size: 8px; padding: 4px 8px; min-width: 100px; top: 5px; left: 5px; }
            #hud .bar { width: 70px; height: 4px; }
            .hud-row { font-size: 7px; }
            #powerupDisplay { font-size: 9px; padding: 3px 10px; bottom: 10px; right: 10px; }
            #restartBtn { font-size: 9px; padding: 3px 8px; top: 5px; right: 5px; }
        }
        /* ---------- QUIZ STYLES ---------- */
        .quiz-container {
            max-width: 400px;
            width: 100%;
            background: #FFFBF0;
            border-radius: 32px;
            padding: 16px;
            text-align: center;
            color: #1E3B4F;
            font-family: 'Segoe UI', system-ui;
            box-shadow: 0 20px 35px black;
        }
        .quiz-question {
            background: #E9F3F8;
            border-radius: 30px;
            padding: 12px;
            margin-bottom: 14px;
            font-size: 1rem;
            font-weight: bold;
        }
        .quiz-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
        }
        .quiz-btn {
            background: #F4C542;
            color: #2C3E50;
            font-size: 0.8rem;
            padding: 6px 12px;
            min-width: 100px;
            box-shadow: 0 3px 0 #B7621A;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .quiz-btn.correct-feedback {
            background: #2E8B57;
            color: white;
        }
        .quiz-btn.wrong-feedback {
            background: #CD5C5C;
            color: white;
        }
        .quiz-feedback {
            background: #FFF2E0;
            border-radius: 24px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="crt-wrapper">
    <div class="crt-screen">
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="grid-bg"></div>

        <!-- CANVAS -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD (in-game) -->
        <div id="hud" class="hidden">
            HP <div class="bar"><div id="hpBar" class="fill" style="width:100%"></div></div>
            XP <div class="bar"><div id="xpBar" class="fill" style="width:0%"></div></div>
            REGEN <div class="bar"><div id="healBar" class="fill" style="width:0%"></div></div>
            <div class="hud-row">
                <span>SCORE: <strong id="scoreVal">0</strong></span>&nbsp;|&nbsp;
                <span>LVL <strong id="lvlVal">1</strong></span>&nbsp;|&nbsp;
                <span id="classLabel">ASSAULT</span>
            </div>
            <div id="evoHint" style="font-size:8px; margin-top:2px; color:#d4af37;"></div>
        </div>
        <div id="powerupDisplay" class="hidden">NO POWERUP</div>
        <div id="restartBtn" class="hidden">RESTART</div>

        <!-- TOUCH CONTROLS -->
        <div class="touch-controls" id="touchControls">
            <div class="joystick-area" id="joystickArea">
                <div class="joystick-knob" id="joystickKnob"></div>
            </div>
            <div class="shoot-btn" id="shootBtn">SHOOT</div>
            <div class="powerup-touch" id="powerupBtn">⚡</div>
        </div>

        <!-- OVERLAY (menus, quiz, etc.) -->
        <div id="overlay"></div>
    </div>
</div>

<script>
    (function() {
        // Placeholder JavaScript for game logic - to be added
        console.log("Safety Shooter initialized");
    })();
</script>

</body>
</html>
